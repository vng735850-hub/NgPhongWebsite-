<!-- V1.1.2 bản tĩnh cho Render Static Site: index.html + config.json (tuỳ chọn) + ảnh/nhạc -->
<style>
:root{--bg:#fff;--fg:#0a0a0a;--card:rgba(255,255,255,.88);--soft:#f3f3f4;--bd:rgba(0,0,0,.16);--ac:#0a0a0a;--mut:#555;--glow:rgba(0,0,0,.1);--btnbg:#0a0a0a;--btnfg:#fff;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--fg:#fff;--card:rgba(20,20,20,.55);--soft:rgba(255,255,255,.07);--bd:rgba(255,255,255,.24);--ac:#fff;--mut:#b8b8b8;--glow:rgba(255,255,255,.1);--btnbg:#fff;--btnfg:#000}}
:root[data-theme="dark"]{--bg:#000;--fg:#fff;--card:rgba(20,20,20,.55);--soft:rgba(255,255,255,.07);--bd:rgba(255,255,255,.24);--ac:#fff;--mut:#b8b8b8;--glow:rgba(255,255,255,.1);--btnbg:#fff;--btnfg:#000}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:var(--bg);color:var(--fg);transition:background .3s,color .3s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
header{display:grid;grid-template-columns:43px 1fr 100px 43px;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--bd);background:var(--card);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
header button,.clock{height:43px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--fg);font-size:20px;cursor:pointer;box-shadow:0 0 12px var(--glow)}
.clock{display:flex;align-items:center;justify-content:center;font:bold 13px monospace;cursor:default}
.title{text-align:center;font-weight:900;color:var(--ac);font-size:clamp(11px,3vw,22px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav{position:fixed;top:0;left:0;bottom:0;width:270px;max-width:82vw;padding:calc(84px + env(safe-area-inset-top,0px)) 12px 20px;background:var(--card);border-right:1px solid var(--bd);border-radius:0 18px 18px 0;transform:translateX(-110%);transition:transform .35s;z-index:30;overflow-y:auto}
nav.show{transform:none}
nav a{display:block;padding:13px;margin:3px 0;border-radius:10px;color:var(--fg);text-decoration:none}
nav a:hover{background:var(--btnbg);color:var(--btnfg)}
#bd{position:fixed;inset:0;background:rgba(0,10,30,.5);opacity:0;pointer-events:none;transition:.3s;z-index:25}
#bd.show{opacity:1;pointer-events:auto}
main{width:min(900px,92%);margin:25px auto 90px;text-align:center}
h1,h2,h3{color:var(--ac)}
.logo{width:110px;height:110px;border-radius:50%;object-fit:contain}
.box,.group{background:var(--card);border:1px solid var(--bd);border-radius:14px;box-shadow:0 0 14px var(--glow);padding:20px 16px;margin:16px auto;max-width:640px}
.group{max-width:none;text-align:left}
.group h3{margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.card{display:flex;flex-direction:column;gap:5px;padding:14px;background:var(--soft);border:1px solid var(--bd);border-radius:12px;color:var(--fg);text-decoration:none}
.card span{font-size:24px}.card small,.msg,.mut{color:var(--mut)}
.btn{display:inline-block;padding:11px 20px;margin:5px;border:0;border-radius:10px;color:var(--btnfg);font-weight:bold;background:var(--btnbg);cursor:pointer;text-decoration:none;font-size:14px}
.btn.green{background:linear-gradient(120deg,#08a75d,#16d68b)}.btn.red{background:#b52c42}
.btn.back{background:var(--soft);color:var(--ac);border:1px solid var(--bd)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:16px auto}
.stats div{padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--card);font-size:13px}
.stats b{display:block;font-size:22px;color:var(--ac)}
.social{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:640px;margin:16px auto}
.social a{padding:18px 8px;border-radius:14px;color:#fff;text-decoration:none;font-weight:800}
.yt{background:linear-gradient(135deg,#ff2a2a,#a30000)}.tt{background:linear-gradient(135deg,#111,#2b2b2b)}
.notice{max-width:760px;margin:16px auto;border:1px solid var(--bd);border-radius:14px;overflow:hidden;text-align:left;background:var(--card)}
.notice b{display:block;padding:11px 14px;background:rgba(128,128,128,.18)}
.notice div{padding:10px 14px;border-bottom:1px dashed var(--bd);white-space:pre-wrap}
.tip{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.tip img,video{width:100%;border-radius:12px;border:1px solid var(--bd)}
.adm{text-align:left}
.adm input,.adm select,.adm textarea{width:100%;padding:9px;margin:4px 0;border-radius:8px;border:1px solid var(--bd);background:var(--soft);color:var(--fg);font-size:14px}
.adm .it{padding:10px;margin:8px 0;border:1px solid var(--bd);border-radius:10px}
.adm label{font-size:12px;color:var(--mut)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:110px}
#amsg{margin:10px 0;font-weight:bold}
#player{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--card);border:1px solid var(--bd);border-radius:16px;box-shadow:0 0 16px var(--glow);max-width:min(92vw,330px)}
#player button{width:38px;height:38px;border:1px solid var(--bd);border-radius:10px;background:var(--btnbg);color:var(--btnfg);font-size:16px;cursor:pointer}
#trk{max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:bold}
#player.min #trk,#player.min #nx{display:none}
.box,.group,header,nav,#player,.stats div,.notice{backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
#toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);z-index:60;max-width:min(88vw,380px);padding:22px;border-radius:16px;background:var(--card);border:1px solid var(--bd);box-shadow:0 0 30px var(--glow);text-align:center;font-weight:bold;opacity:0;pointer-events:none;transition:.25s;backdrop-filter:blur(16px)}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.scene{perspective:900px;padding:10px;overflow:hidden}
.pv3d{transform-style:preserve-3d;transition:transform .3s;border:1px solid var(--bd);border-radius:14px;padding:16px;background:var(--soft)}
.layer{display:block;margin:8px 0;padding:10px;border:1px dashed var(--bd);border-radius:10px;background:var(--card);color:var(--fg);transform:translateZ(var(--z,0px));box-shadow:0 12px 24px rgba(0,0,0,.25);outline:none}
.layer:focus{border-style:solid}
@media(max-width:600px){.grid,.tip{grid-template-columns:1fr}}
</style>
</head>
<body>

 <button id="burger" aria-label="Menu">☰</button>

  {key:"location",tag:"freefire",icon:"📍",name:"Định Vị Xanh Tím OB55",file:"DINH_VI_BT.zip",gateUrl:"",url:"https://www.mediafire.com/file/yen60lu05hfnng4/DINH_VI_BT.zip/file"},
  {key:"deta",tag:"freefire",icon:"🔐",name:"DETA IPA CRACK NOKEY",file:"Deta_Crack.7z",gateUrl:"",url:"https://www.mediafire.com/file/wohet4glfwyn5j0/Deta_Crack.7z/file"},

  {key:"ysm",tag:"lienquan",icon:"⚔️",name:"MENU YSM TEAM LIÊN QUÂN",file:"YSM_TEAM_LIEN_QUAN.apk",gateUrl:"",url:"https://www.mediafire.com/file/x9xo2468orsfr3l/YSM_TEAM_LIEN_QUAN.apk/file"},

  {key:"detaqt",tag:"roblox",icon:"🌍",name:"DETA QUỐC TẾ",file:"Delta V2.747 Quoc Te.apk",gateUrl:"",url:"https://www.mediafire.com/file/i52c3sjorqv5soo/Delta+V2.747+Quoc+Te.apk/file"}],
 notices:[],
 music:[],
 site:{title:"NGUYỄN VĂN PHONG WEBSITE",heading:"WELCOME TO PHONG WEB",sub:"Chào mừng bạn đến với website của Nguyễn Văn Phong. 📍 ĐỊNH VỊ XANH TÍM OB55",social:true,stats:true,notice:true,tilt:8},
 maint:{on:false,msg:"Web đang bảo trì. Vui lòng quay lại sau."}
};
const YOUTUBE="https://youtube.com/@phongngno1.treorank?si=EzywiALRAmFAGT58";
const TIKTOK="https://vm.tiktok.com/ZS9PAhyxoUMWy-PKpM7/";
/* ===== LINK4M API (dán token vào đây) — token nằm trong mã trang nên ai xem mã cũng thấy ===== */
const LINK4M_API_TOKEN="DAN_TOKEN_LINK4M_CUA_BAN_VAO_DAY";
const LINK4M_ENDPOINT="https://link4m.co/api-shorten/v2";

/* ===== TIỆN ÍCH ===== */
const $=id=>document.getElementById(id);
function el(t,c,x,a){const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;if(a)Object.assign(e,a);return e}
function lk(h,c,x){return el("a",c,x,{href:h})}
function card(h,i,sub){const a=lk(h,"card");a.append(el("span","",i.icon),el("b","",i.name),el("small","",sub));return a}
function bk(h,t){return lk(h,"btn back",t||"← QUAY LẠI")}
function okUrl(u){return typeof u==="string"&&/^https:\/\/[^\s]+$/i.test(u)}
function okSrc(u){return okUrl(u)||/^[\w\-./]+\.(mp3|ogg|m4a|wav)$/i.test(u)}
function slug(s){return String(s||"").toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"")}
const fmt=n=>Number(n||0).toLocaleString("vi-VN");

let cfg=JSON.parse(JSON.stringify(DEF)),stats=[],dbh=null,mine=null,uid="",isAdmin=false,canWrite=true,draft=null,canLog=true,unlocked=false,unL=null,myLog=[],lastLog="",lastLogT=0;
function toastMsg(m){const t=$("toast");t.textContent="🛠️ "+m;t.classList.add("show");clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove("show"),3500)}
function logAct(a,d){
 if(!dbh||!uid||!canLog)return;
 const key=a+"|"+d,now=Date.now();if(key===lastLog&&now-lastLogT<10000)return;lastLog=key;lastLogT=now;
 dbh.collection("logs").doc(uid).set((myLog.push({t:now,a:a,d:String(d||"").slice(0,120)}),myLog=myLog.slice(-40),{uid:uid,device:mine?mine.device:"",entries:myLog})).catch(()=>{canLog=false});
}

function norm(d){
 const o=JSON.parse(JSON.stringify(DEF));
 if(d&&Array.isArray(d.tags))o.tags=d.tags;
 if(d&&Array.isArray(d.items))o.items=d.items;
 o.items.forEach(x=>{if(x&&x.key==="nvpkey"&&!x.gateUrl)x.gateUrl="https://link4m.net/OQxphm"});
 if(d&&Array.isArray(d.notices))o.notices=d.notices;
 if(d&&Array.isArray(d.music))o.music=d.music;
 if(d&&d.site&&typeof d.site==="object")o.site=Object.assign(o.site,d.site);
 if(d&&d.maint&&typeof d.maint==="object")o.maint=Object.assign(o.maint,d.maint);
 return o;
}

/* ===== GIAO DIỆN ===== */
function curTheme(){return document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}
function setTheme(t,save){document.documentElement.dataset.theme=t;$("theme").textContent=t==="dark"?"🌙":"☀️";if(save)try{localStorage.setItem("phong_theme",t)}catch(e){}}
try{const s=localStorage.getItem("phong_theme");if(s)document.documentElement.dataset.theme=s}catch(e){}
setTheme(curTheme(),false);
$("theme").onclick=()=>setTheme(curTheme()==="dark"?"light":"dark",true);
function tick(){
 const p={};new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Ho_Chi_Minh",hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"}).formatToParts(new Date()).forEach(x=>p[x.type]=x.value);
 const h=+p.hour;$("clock").textContent=(h>=6&&h<13?"🌅":h>=13&&h<19?"☀️":"🌙")+" "+p.hour+":"+p.minute+":"+p.second;
}
tick();setInterval(tick,1000);

/* ===== MENU 3 GẠCH ===== */
const nav=$("nav"),bd=$("bd");
function menu(on){nav.classList.toggle("show",on);bd.classList.toggle("show",on)}
$("burger").onclick=()=>menu(!nav.classList.contains("show"));
bd.onclick=()=>menu(false);
document.addEventListener("keydown",e=>{if(e.key==="Escape")menu(false)});
nav.addEventListener("click",e=>{if(e.target.tagName==="A")menu(false)});
function drawNav(){
 $("siteTitle").textContent=cfg.site.title;document.title=cfg.site.title;
 nav.replaceChildren(lk("#home","","🏠 TRANG CHỦ"));
 cfg.tags.forEach(t=>nav.append(lk("#tag-"+t.slug,"",t.icon+" "+t.name)));
 nav.append(lk("#admin","","⚙️ QUẢN TRỊ"));
}

/* ===== THỐNG KÊ ===== */
function calcStats(){
 const now=Date.now(),r={users:stats.length,online:0,gates:0,files:0,android:0,iphone:0};
 stats.forEach(s=>{if(now-(s.last||0)<120000)r.online++;r.gates+=+s.gates||0;r.files+=+s.files||0;if(s.device==="android")r.android++;if(s.device==="iphone")r.iphone++});
 return r;
}
function paintStats(){
 const r=calcStats();
 ["users","online","gates","files","android","iphone"].forEach(k=>{document.querySelectorAll('[data-st="'+k+'"]').forEach(e=>e.textContent=fmt(r[k]))});
}
setInterval(paintStats,30000);
function statBox(items){
 const w=el("div","stats");
 items.forEach(([k,l])=>{const d=el("div","",l);const b=el("b","","…");b.dataset.st=k;d.prepend(b);w.append(d)});
 return w;
}
async function saveMine(){
 if(!dbh||!uid||!canWrite||!mine)return;
 try{await dbh.collection("stats").doc(uid).set(mine)}catch(e){canWrite=false}
}
function bump(k,d){if(!mine)return;mine[k]=(+mine[k]||0)+1;mine.last=Date.now();saveMine();logAct(k==="gates"?"Vượt link":"Lấy file",d)}

/* ===== TRANG CHỦ / TAG / MỤC ===== */
function home(app){
 app.append(el("img","logo","",{src:"logo.png",alt:"PHONG WEB",onerror(){this.remove()}}));
 app.append(el("h1","",cfg.site.heading));
 app.append(el("p","msg",cfg.site.sub));
 if(cfg.maint.on)app.append(el("p","msg","🛠️ "+cfg.maint.msg,{style:"font-weight:bold"}));
 const s=el("div","social");
 const y=lk(YOUTUBE,"yt","▶️ YOUTUBE");y.target="_blank";y.rel="noopener noreferrer";
 const t=lk(TIKTOK,"tt","🎵 TIKTOK");t.target="_blank";t.rel="noopener noreferrer";
 s.append(y,t);if(cfg.site.social!==false)app.append(s);
 if(cfg.site.stats!==false)app.append(statBox([["users","👁 Người dùng"],["online","🟢 Online"],["gates","✅ Vượt link"],["files","📥 Lấy file"]]));
 const n=el("section","notice");n.append(el("b","","📢 BẢNG THÔNG BÁO"));
 const act=cfg.notices.filter(x=>x&&x.enabled!==false&&x.text);
 if(!act.length)n.append(el("div","","Hiện chưa có thông báo nào."));
 act.forEach(x=>n.append(el("div","",(x.time?"🕒 "+x.time+"\n":"")+x.text)));
 if(cfg.site.notice!==false)app.append(n);
 app.append(el("h2","","🌐 KHÁM PHÁ TẤT CẢ DANH MỤC"));
 cfg.tags.forEach(tag=>{
  const g=el("section","group"),h=el("h3","",tag.icon+" "+tag.name+"  ");h.append(lk("#tag-"+tag.slug,"","Xem Tag →"));
  const grid=el("div","grid");
  if(tag.slug==="settingtreo")grid.append(card("#tag-settingtreo",{icon:"⚠️",name:"LƯU Ý KHI TREO"},"Xem hình lưu ý"),card("#tag-settingtreo",{icon:"🎬",name:"CÁCH CÀI SETTING"},"Xem video hướng dẫn"));
  cfg.items.filter(i=>i.tag===tag.slug).forEach(i=>grid.append(card("#item-"+i.key,i,"Mở mục")));
  g.append(h,grid);app.append(g);
 });
}
function tagPage(app,sl){
 const tag=cfg.tags.find(t=>t.slug===sl);if(!tag)return home(app);
 const b=el("div","box");b.append(el("div","",tag.icon,{style:"font-size:46px"}),el("h2","","CHÀO BẠN ĐẾN VỚI "+tag.name));app.append(b);
 if(sl==="settingtreo"){
  const a=el("div","box"),g=el("div","tip");a.append(el("h2","","⚠️ LƯU Ý KHI TREO"));
  ["luu-y1.png","luu-y2.png"].forEach(f=>g.append(el("img","","",{src:f,alt:"Lưu ý khi treo",loading:"lazy",onerror(){this.remove()}})));
  a.append(g);
  const v=el("div","box");v.append(el("h2","","🎬 CÁCH CÀI SETTING"),el("video","","",{src:"cach-cai-settingtreo.mp4",controls:true,playsInline:true,preload:"metadata"}));
  app.append(a,v);
 }
 const list=cfg.items.filter(i=>i.tag===sl);
 if(!list.length)app.append(el("p","msg","Chưa có mục nào trong Tag này."));
 list.forEach(i=>{const c=el("div","box");c.append(el("h2","",i.icon+" "+i.name),lk("#item-"+i.key,"btn","MỞ MỤC"));app.append(c)});
 app.append(bk("#home","← TRANG CHỦ"));
}
function itemPage(app,key,step){
 const it=cfg.items.find(i=>i.key===key);if(!it)return home(app);
 const back="#tag-"+it.tag,b=el("div","box");if(!step)logAct("Mở mục",it.name);
 if(step==="thanks"){
  const au=el("audio","","",{src:"cam-on-tu-phong.mp3",preload:"none"});
  b.append(el("h2","","CẢM ƠN BẠN ĐÃ VƯỢT LINK ỦNG HỘ WEBSITE"),
   el("img","","",{src:"cam-on-tu-phong.png",alt:"Cảm ơn từ Phong",style:"width:min(260px,90%);cursor:pointer;border-radius:12px",onclick(){au.play().catch(()=>{})},onerror(){this.remove()}}),au);
  const nx=lk("#done-"+key,"btn","TIẾP THEO");nx.onclick=()=>bump("gates",it.name);
  b.append(el("p","msg","Nhấn vào hình để phát lời cảm ơn."),nx);
 }else if(step==="done"){
  const a=lk(okUrl(it.url)?it.url:"#home","btn green","LẤY FILE");a.target="_blank";a.rel="noopener noreferrer";a.onclick=()=>bump("files",it.name);
  b.append(el("div","","✅",{style:"font-size:48px"}),el("h2","","VƯỢT LINK THÀNH CÔNG"),a,el("br"),bk(back));
 }else{
  const g=lk("#thanks-"+key,"btn","🔓 VƯỢT LINK");
  g.onclick=async e=>{
   if(LINK4M_API_TOKEN.startsWith("DAN_TOKEN")){if(okUrl(it.gateUrl))window.open(it.gateUrl,"_blank","noopener");return}
   e.preventDefault();g.textContent="ĐANG TẠO LINK...";

function route(){

const aud=$("aud"),pp=$("pp");let ti=0,started=false;
function tracks(){return cfg.music.filter(m=>m&&okSrc(m.src))}
function trkName(){const t=tracks();$("trk").textContent=t.length?(t[ti%t.length].name||"Bài "+(ti+1)):"Chưa có nhạc"}
async function playIdx(n){
 const t=tracks();if(!t.length){trkName();return}
 ti=(n+t.length)%t.length;aud.src=t[ti].src;trkName();
 try{await aud.play();started=true;pp.textContent="Ⅱ"}catch(e){pp.textContent="▶"}
}
pp.onclick=async()=>{
 if(!tracks().length)return;
 if(aud.paused){if(!started)await playIdx(ti);else{try{await aud.play();pp.textContent="Ⅱ"}catch(e){}}}
 else{aud.pause();pp.textContent="▶"}
};
$("nx").onclick=()=>playIdx(ti+1);
aud.addEventListener("ended",()=>playIdx(ti+1));
aud.addEventListener("error",()=>{pp.textContent="▶"});
$("mn").onclick=()=>{const p=$("player");p.classList.toggle("min");$("mn").textContent=p.classList.contains("min")?"♫":"−"};

/* ===== KẾT NỐI DỮ LIỆU CHUNG ===== */
let fileCfg=null;
function makeDb(){
 const subs=[];
 const ld=k=>{try{return JSON.parse(localStorage.getItem("phong_"+k)||"null")}catch(e){return null}};
 const sv=(k,v)=>{try{localStorage.setItem("phong_"+k,JSON.stringify(v))}catch(e){}};
 const fire=t=>subs.forEach(s=>{if(s[0]===t)s[1]()});
 fetch("config.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(d=>{fileCfg=d;fire("config")}).catch(()=>{});
 return{
  doc:()=>({
   set:async v=>{sv("config",v);fire("config")},
   onSnapshot:fn=>{const f=()=>{const v=ld("config")||fileCfg;fn({exists:!!v,data:()=>v})};subs.push(["config",f]);f();return()=>{}}
  }),
  collection:name=>({
   doc:id=>({
    get:async()=>{const v=ld(name+"_"+id);return{exists:!!v,data:()=>v}},
    set:async v=>{sv(name+"_"+id,v);const ids=ld(name+"_ids")||[];if(!ids.includes(id)){ids.push(id);sv(name+"_ids",ids)}fire(name)}}),
   onSnapshot:fn=>{const f=()=>{const docs=(ld(name+"_ids")||[]).map(id=>({data:()=>ld(name+"_"+id)}));fn({docs,empty:!docs.length})};subs.push([name,f]);f();return()=>{}}
  })
 };
}
async function init(){
 drawNav();route();trkName();
 try{
  const db=makeDb(),user={canEdit:async()=>true,id:async()=>{let i="";try{i=localStorage.getItem("phong_uid")||"";if(!i){i=Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem("phong_uid",i)}}catch(e){i="local"}return i}};
  if(user){try{isAdmin=!!(await user.canEdit())}catch(e){}}
  if(!db){canWrite=false;return}
  dbh=db;
  if(user){try{uid=await user.id()}catch(e){}}
  db.doc("config/main").onSnapshot(s=>{
   cfg=norm(s.exists?s.data():null);
   const sig=location.hash.slice(1);
   if(sig!=="admin"){route()}
   trkName();
  },()=>{});
  db.collection("stats").onSnapshot(s=>{stats=s.docs.map(d=>d.data()||{});paintStats()},()=>{});
  if(uid){
   const ua=navigator.userAgent.toLowerCase(),dev=ua.includes("iphone")?"iphone":ua.includes("android")?"android":"other";
   let old={};try{const s=await db.collection("stats").doc(uid).get();if(s.exists)old=s.data()||{}}catch(e){}
   mine={device:dev,first:old.first||Date.now(),gates:+old.gates||0,files:+old.files||0,last:Date.now()};
   saveMine();logAct("Truy cập","");setInterval(()=>{if(!document.hidden){mine.last=Date.now();saveMine()}},60000);
  }
 }catch(e){}
}
setTimeout(()=>{if(!dbh)paintStats()},3000);
init();
