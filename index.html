/* ===== CODE: nhập code để vào thẳng trang Cảm ơn (code dạng NVP-KEY-XXX-XXX, lưu ở Firestore: codes/<code>) ===== */
const CODE_RE=/^NVP-KEY-[A-Z0-9]{3}-[A-Z0-9]{3}$/;
let codeFail=0,codeLock=0;
const codeKeys=c=>Array.isArray(c.items)?c.items:(c.item?[c.item]:[]); // hỗ trợ code cũ (1 mục) và code mới (nhiều mục)
async function redeemCode(it,raw){
 const code=String(raw||"").trim().toUpperCase();
 if(!CODE_RE.test(code))return{ok:false,bad:true,msg:"Code không đúng định dạng NVP-KEY-XXX-XXX."};
 if(!dbh)return{ok:false,msg:"Chưa kết nối máy chủ nên chưa dùng được code."};
 const ref=dbh.collection("codes").doc(code);
 try{
  const res=await dbh.runTransaction(async tx=>{
   const s=await tx.get(ref);
   if(!s.exists)return"nf";
   const d=s.data()||{};
   if(!d.all&&!codeKeys(d).includes(it.key))return"wrong";
   const used=+d.used||0;
   if(used>=(+d.max||0))return"full";
   tx.update(ref,{used:used+1,last:Date.now()});
   return"ok";
  });
  if(res==="ok")return{ok:true};
  if(res==="full")return{ok:false,msg:"Code này đã hết lượt dùng."};
  if(res==="wrong")return{ok:false,bad:true,msg:"Code này không dùng được cho mục này."};
  return{ok:false,bad:true,msg:"Code không tồn tại."};
 }catch(e){return{ok:false,msg:"Không kiểm tra được code. Vui lòng thử lại sau."}}
}

/* ===== ĐIỀU HƯỚNG ===== */
function route(){
 if(winTick){clearInterval(winTick);winTick=0}
 applyVol();
 const app=$("app");app.replaceChildren();app.classList.remove("adm");drawNav();
 const h=location.hash.slice(1),i=h.indexOf("-"),k=i<0?h:h.slice(0,i);let a=i<0?"":h.slice(i+1);
 if((k==="item"||k==="thanks"||k==="done")&&cfg.maint.on&&!unlocked){history.replaceState(null,"","#home");toastMsg(cfg.maint.msg);home(app);paintStats();return}
 if(GATE_ON&&!unlocked&&(k==="thanks"||k==="done")){
  let key=a,tok="";
  if(k==="thanks"){const j=a.indexOf("~");if(j>=0){key=a.slice(0,j);tok=a.slice(j+1)}}
  if(cfg.items.some(x=>x.key===key)){
   if(k==="thanks"&&tok)gateCheck(key,tok);
   const ok=gateOk(key);
   if(!ok){const exp=winGet(key)>0;history.replaceState(null,"","#item-"+key);toastMsg(exp?"Đã hết 10 phút. Vui lòng bấm VƯỢT LINK để tạo link mới.":"Bạn cần bấm VƯỢT LINK và hoàn thành vượt link trước.");itemPage(app,key,"");paintStats();window.scrollTo(0,0);return}
   if(k==="thanks"&&tok)history.replaceState(null,"","#thanks-"+key)
  }
  a=key;
 }
 if(k==="admin")adminPage(app);
 else if(k==="tag")tagPage(app,a);
 else if(k==="item"||k==="thanks"||k==="done")itemPage(app,a,k==="item"?"":k);
 else home(app);
 paintStats();window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
$("app").addEventListener("click",e=>{const a=e.target.closest&&e.target.closest("a");if(!a||unlocked||!cfg.maint.on)return;if(/^#(item|thanks|done)-/.test(a.getAttribute("href")||"")){e.preventDefault();toastMsg(cfg.maint.msg)}},true);

/* ===== NHẠC ===== */
const aud=$("aud"),pp=$("pp");let ti=0,started=false;
function tracks(){return cfg.music.filter(m=>m&&okSrc(m.src))}
function trkName(){const t=tracks();$("trk").textContent=t.length?(t[ti%t.length].name||"Bài "+(ti+1)):"Chưa có nhạc"}
async function playIdx(n){
 const t=tracks();if(!t.length){trkName();return}
 ti=(n+t.length)%t.length;aud.src=t[ti].src;trkName();
 try{await aud.play();started=true;pp.textContent="Ⅱ"}catch(e){pp.textContent="▶"}
}
pp.onclick=async()=>{
 if(!tracks().length)return;
 if(aud.paused){if(!started)await playIdx(ti);else{try{await aud.play();pp.textContent="Ⅱ"}catch(e){}}}
 else{aud.pause();pp.textContent="▶"}
};
$("nx").onclick=()=>playIdx(ti+1);
aud.addEventListener("ended",()=>playIdx(ti+1));
aud.addEventListener("error",()=>{pp.textContent="▶"});
function applyVol(){const v=typeof cfg.vol==="number"?cfg.vol:10;aud.volume=Math.max(0,Math.min(1,v/10))}
applyVol();

/* ===== KẾT NỐI DỮ LIỆU CHUNG ===== */
let fileCfg=null;
function loadJs(s){return new Promise((ok,no)=>{const e=document.createElement("script");e.src=s;e.onload=ok;e.onerror=no;document.head.append(e)})}
async function getDb(){
 if(FIREBASE_CONFIG.apiKey){try{
  const v="https://www.gstatic.com/firebasejs/10.12.2/";
  await loadJs(v+"firebase-app-compat.js");await loadJs(v+"firebase-firestore-compat.js");
  firebase.initializeApp(FIREBASE_CONFIG);shared=true;return firebase.firestore();
 }catch(e){}}
 return makeDb();
}
function makeDb(){
 const subs=[];
 const ld=k=>{try{return JSON.parse(localStorage.getItem("phong_"+k)||"null")}catch(e){return null}};
 const sv=(k,v)=>{try{localStorage.setItem("phong_"+k,JSON.stringify(v))}catch(e){}};
 const fire=t=>subs.forEach(s=>{if(s[0]===t)s[1]()});
 fetch("config.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(d=>{fileCfg=d;fire("config")}).catch(()=>{});
 return{
  doc:()=>({
   set:async v=>{sv("config",v);fire("config")},
   onSnapshot:fn=>{const f=()=>{const v=ld("config")||fileCfg;fn({exists:!!v,data:()=>v})};subs.push(["config",f]);f();return()=>{}}
  }),
  collection:name=>({
   doc:id=>({
    get:async()=>{const v=ld(name+"_"+id);return{exists:!!v,data:()=>v}},
    set:async v=>{sv(name+"_"+id,v);const ids=ld(name+"_ids")||[];if(!ids.includes(id)){ids.push(id);sv(name+"_ids",ids)}fire(name)}}),
   onSnapshot:fn=>{const f=()=>{const docs=(ld(name+"_ids")||[]).map(id=>({id:id,data:()=>ld(name+"_"+id)}));fn({docs,empty:!docs.length})};subs.push([name,f]);f();return()=>{}}
  })
 };
}
async function init(){
 drawNav();route();trkName();
 try{
  const db=await getDb(),user={canEdit:async()=>true,id:async()=>{let i="";try{i=localStorage.getItem("phong_uid")||"";if(!i){i=Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem("phong_uid",i)}}catch(e){i="local"}return i}};
  if(user){try{isAdmin=!!(await user.canEdit())}catch(e){}}
  if(!db){canWrite=false;return}
  dbh=db;
  if(user){try{uid=await user.id()}catch(e){}}
  db.doc("config/main").onSnapshot(s=>{
   cfg=norm(s.exists?s.data():null);applyVol();
   const sig=location.hash.slice(1);
   if(sig!=="admin"){route()}
   trkName();
  },()=>{});
  db.collection("stats").onSnapshot(s=>{stats=s.docs.map(d=>Object.assign({_id:d.id||""},d.data()||{}));paintStats()},()=>{});
  if(uid){
   const ua=navigator.userAgent.toLowerCase(),dev=ua.includes("iphone")?"iphone":ua.includes("android")?"android":"other";
   let old={};try{const s=await db.collection("stats").doc(uid).get();if(s.exists)old=s.data()||{}}catch(e){}
   mine={device:dev,first:old.first||Date.now(),gates:+old.gates||0,codes:+old.codes||0,files:+old.files||0,items:(old.items&&typeof old.items==="object")?old.items:{},last:Date.now()};
   saveMine();logAct("Truy cập","");setInterval(()=>{if(!document.hidden){mine.last=Date.now();saveMine()}},60000);
  }
 }catch(e){}
}
setTimeout(()=>{if(!dbh)paintStats()},3000);
init();
</script>
<script>
(function(){
 var root=document.querySelector(".u289"),H=document.documentElement;
 var fb=root.querySelector(".u289-fb"),pn=root.querySelector(".u289-pn"),dn=root.querySelector(".u289-dn"),up=root.querySelector(".u289-up"),fv=root.querySelector(".u289-fv"),sws=root.querySelector(".u289-sws"),rs=root.querySelector(".u289-rs");
 var SW=["Tương phản cao","Nổi bật liên kết","Giãn dòng rộng"],CLS=["u289-hc","u289-ln","u289-lh"],STEPS=[0.9,1,1.15,1.3],k=1,on=[false,false,false];
 try{var sv=JSON.parse(localStorage.getItem("phong_a11y")||"null");if(sv&&sv.k>=0&&sv.k<STEPS.length){k=sv.k|0;if(Array.isArray(sv.on))on=[!!sv.on[0],!!sv.on[1],!!sv.on[2]]}}catch(e){}
 var B=SW.map(function(t,i){
  var r=document.createElement("div");r.className="u289-rw";r.innerHTML='<span></span><button type="button" class="u289-sw" role="switch" aria-checked="false"></button>';
  r.firstChild.textContent=t;var b=r.lastChild;b.setAttribute("aria-label",t);
  b.addEventListener("click",function(){on[i]=!on[i];sync()});
  sws.appendChild(r);return b;
 });
 function sync(){
  H.style.setProperty("--u289-fs",STEPS[k]);H.classList.toggle("u289-z",STEPS[k]!==1);
  fv.textContent=Math.round(STEPS[k]*100)+"%";dn.disabled=k===0;up.disabled=k===STEPS.length-1;
  B.forEach(function(b,i){b.setAttribute("aria-checked",on[i]);H.classList.toggle(CLS[i],on[i])});
  try{localStorage.setItem("phong_a11y",JSON.stringify({k:k,on:on}))}catch(e){}
 }
 dn.addEventListener("click",function(){if(k>0){k--;sync()}});
 up.addEventListener("click",function(){if(k<STEPS.length-1){k++;sync()}});
 rs.addEventListener("click",function(){k=1;on=[false,false,false];sync()});
 var pl=document.getElementById("player"),sa=root.querySelector(".u289-sa"),sm=root.querySelector(".u289-sm");
 var last="plus";try{var lv=localStorage.getItem("phong_dock_last");if(lv==="m"||lv==="a")last=lv}catch(e){}
 function set(v){
  if(v==="music"||v==="a11y"){last=v==="music"?"m":"a";try{localStorage.setItem("phong_dock_last",last)}catch(e){}}
  root.dataset.i=v==="menu"?"x":v==="music"?"m":v==="a11y"?"a":last;
  root.dataset.s=v;pn.setAttribute("aria-hidden",v!=="a11y");pl.setAttribute("aria-hidden",v!=="music");
  fb.setAttribute("aria-expanded",v!=="");fb.setAttribute("aria-label",v?"Đóng":"Mở menu nhạc và trợ năng");
  var f=v==="menu"?sm:v==="a11y"?up:v==="music"?document.getElementById("pp"):null;
  if(f)setTimeout(function(){f.focus({preventScroll:true})},200);
 }
 fb.addEventListener("click",function(){set(root.dataset.s?"":"menu")});
 sm.addEventListener("click",function(){set("music")});
 sa.addEventListener("click",function(){set("a11y")});
 document.addEventListener("click",function(e){if(root.dataset.s&&!root.contains(e.target))set("")});
 root.addEventListener("keydown",function(e){if(e.key==="Escape"&&root.dataset.s){set("");fb.focus()}});
 sync();set("");
})();
</script>
